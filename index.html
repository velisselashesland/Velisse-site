<!-- [Το υπόλοιπο HTML παραμένει το ίδιο μέχρι το τέλος του script] -->

    <!-- SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDHBJ5KO_vofsZ9dnVv4BFaeKbwxSSkkO0",
            authDomain: "velissebook.firebaseapp.com",
            projectId: "velissebook",
            storageBucket: "velissebook.firebasestorage.app",
            messagingSenderId: "223338416423",
            appId: "1:223338416423:web:3ffd9c6fdb767ad5100102",
            measurementId: "G-7GPKKBH9C3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- (Οι μεταφράσεις παραμένουν εδώ όπως τις είχατε) ---

        // LOGIC FOR BOOKING SLOTS
        const serviceDurations = { "One by One": 150, "Volume": 150, "Half Set": 120, "Special Effects": 150, "Lash Lift & Tint": 60, "Brow Lift & Tint": 60, "Lash & Brow Lift Combo": 90 };
        function parseTimeToMinutes(t) { const [h, m] = t.split(':').map(Number); return h * 60 + m; }

        async function generateTimeSlots() {
            const dateInput = document.getElementById('date').value;
            const serviceSelect = document.getElementById('service').value;
            const slotsContainer = document.getElementById('slotsContainer');
            if (!dateInput || !serviceSelect) return;

            slotsContainer.innerHTML = currentLang === 'el' ? 'Φόρτωση...' : 'Loading...';
            const q = query(collection(db, "appointments"), where("date", "==", dateInput));
            const querySnapshot = await getDocs(q);
            const bookedIntervals = [];
            querySnapshot.forEach((doc) => {
                const appt = doc.data();
                const startM = parseTimeToMinutes(appt.time);
                bookedIntervals.push({ start: startM, end: startM + (appt.duration || 60) });
            });

            const duration = serviceDurations[serviceSelect] || 60;
            slotsContainer.innerHTML = '';
            
            for (let hour = 8; hour < 20; hour++) {
                for (let minute = 0; minute < 60; minute += 30) {
                    const timeStr = `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
                    const slotStart = parseTimeToMinutes(timeStr);
                    const slotEnd = slotStart + duration;
                    
                    if (slotEnd > 20 * 60) continue;

                    let isConflict = bookedIntervals.some(i => slotStart < i.end && slotEnd > i.start);
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.innerText = timeStr;
                    btn.className = 'slot-btn';
                    
                    if (isConflict) { 
                        btn.classList.add('booked'); 
                        btn.disabled = true; 
                    } else {
                        btn.addEventListener('click', () => {
                            document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
                            btn.classList.add('selected');
                            document.getElementById('selectedTime').value = timeStr;
                            document.getElementById('personalDetailsSection').style.display = 'block';
                        });
                    }
                    slotsContainer.appendChild(btn);
                }
            }
        }

        document.getElementById('date').addEventListener('change', generateTimeSlots);
        document.getElementById('service').addEventListener('change', generateTimeSlots);

        // Submit Booking
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const apptData = {
                service: document.getElementById('service').value,
                date: document.getElementById('date').value,
                time: document.getElementById('selectedTime').value,
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                notes: document.getElementById('notes').value,
                duration: serviceDurations[document.getElementById('service').value]
            };

            try {
                await addDoc(collection(db, "appointments"), apptData);
                alert(currentLang === 'el' ? "Το ραντεβού κλείστηκε επιτυχώς!" : "Appointment booked successfully!");
                location.reload();
            } catch (err) {
                alert("Error: " + err.message);
            }
        });
    </script>
</body>
</html>
