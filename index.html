<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VELISSE Lash & Brow Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #F5F2EC;
      --card-bg: #FFFFFF;
      --pill-bg: #F2EBE1;
      --text: #1A1A1A;
      --subtext: #8E867E;
      --border: #E8E2D9;
      --accent: #D4B483;
      --badge-bg: #F7EFE3;
      --badge-text: #A38051;
      --time-border: #D0D8E0;
      --time-blue: #2B72C4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(0,0,0,0.03);
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      background: #111;
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .logo-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      letter-spacing: 4px;
      font-weight: 500;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .lang-switcher {
      border: 1px solid var(--text);
      padding: 5px 14px;
      border-radius: 20px;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .menu-toggle {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text);
    }
    .dropdown-menu {
      display: none;
      position: absolute;
      top: 60px;
      left: 0;
      width: 100%;
      background: var(--bg);
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      z-index: 999;
    }
    .dropdown-menu.active { display: block; }
    .dropdown-menu a {
      display: block;
      padding: 10px 0;
      text-decoration: none;
      color: var(--text);
      font-size: 15px;
    }

    /* HERO */
    .hero {
      position: relative;
      height: 60vh;
      min-height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #111;
    }
    .hero-slides { position: absolute; inset: 0; }
    .hero-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .8s ease;
    }
    .hero-slide.active { opacity: 1; }
    .hero-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.35); }
    .hero-content {
      position: relative;
      z-index: 2;
      color: #fff;
      text-align: center;
      padding: 0 20px;
    }
    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 400;
      letter-spacing: 1px;
    }

    /* CONTAINER & CARDS */
    .container {
      max-width: 680px;
      margin: 30px auto;
      padding: 0 16px;
    }
    .section-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 32px 24px;
      margin-bottom: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
    }

    /* PRICELIST SECTION STYLING */
    .price-header-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      letter-spacing: 5px;
      text-align: center;
      color: #8E867E;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .price-sub-info {
      text-align: center;
      font-size: 13px;
      color: #4A4A4A;
      margin-bottom: 20px;
    }
    .badge-gift-header {
      display: inline-block;
      background: #FFF8EE;
      border: 1px dashed #E5C396;
      color: #B58A4C;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: 4px;
    }

    /* OFFERS TABS CONTAINER (PILL STYLE) */
    .offers-pill-container {
      background: var(--pill-bg);
      border-radius: 30px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }
    .offer-tab-btn {
      padding: 10px 14px;
      border-radius: 20px;
      border: none;
      background: transparent;
      font-size: 13px;
      color: #555;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .offer-tab-btn.active {
      background: #1A1A1A;
      color: #FFFFFF;
      font-weight: 500;
    }

    /* PRICE LIST TABLE */
    .price-table-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 2px;
      color: #999;
      text-transform: uppercase;
      padding-bottom: 12px;
      border-bottom: 1px solid #F0F0F0;
      margin-bottom: 8px;
    }
    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #F7F7F7;
    }
    .price-service-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-weight: 600;
      color: #1A1A1A;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .item-gift-badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 500;
    }
    .price-value {
      font-size: 16px;
      font-weight: 600;
      color: #1A1A1A;
    }

    /* BOOKING SECTION STYLING */
    .booking-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      letter-spacing: 3px;
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .booking-subtitle {
      font-size: 11px;
      letter-spacing: 2px;
      color: #8E867E;
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .form-step-label {
      font-size: 13px;
      color: #555;
      margin-bottom: 8px;
      display: block;
      font-weight: 500;
    }

    .booking-input, .booking-select {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #FFF;
      font-size: 14px;
      color: #333;
      outline: none;
      margin-bottom: 20px;
      font-family: inherit;
    }
    .booking-input:focus, .booking-select:focus {
      border-color: #1A1A1A;
    }

    /* TIME GRID */
    .time-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }
    .time-slot {
      padding: 10px 0;
      border: 1px solid #EAEAEA;
      border-radius: 8px;
      background: #FAFAFA;
      color: #BBB;
      font-size: 13px;
      text-align: center;
      cursor: not-allowed;
      transition: all 0.2s ease;
    }
    .time-slot.available {
      background: #FFFFFF;
      border-color: var(--time-border);
      color: var(--time-blue);
      cursor: pointer;
    }
    .time-slot.available:hover, .time-slot.selected {
      background: var(--time-blue);
      color: #FFF;
      border-color: var(--time-blue);
    }

    /* CLIENT FORM FIELDS */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .btn-submit-booking {
      width: 100%;
      background: #1A1A1A;
      color: #FFF;
      padding: 16px;
      border-radius: 30px;
      border: none;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }
    .btn-submit-booking:hover {
      background: #333;
    }

    footer {
      text-align: center;
      padding: 24px 0;
      color: #999;
      font-size: 0.8rem;
    }

    @media(max-width: 480px) {
      .time-grid { grid-template-columns: repeat(4, 1fr); }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <a href="#home" class="logo-container">
      <div class="logo-icon"><i class="fa-regular fa-eye"></i></div>
      <span class="logo-text">VELISSE</span>
    </a>
    <div class="header-right">
      <button id="langToggle" class="lang-switcher"><i class="fa-solid fa-globe"></i> EN</button>
      <button class="menu-toggle" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
    </div>
    <nav id="dropdownMenu" class="dropdown-menu">
      <a href="#home">Αρχική</a>
      <a href="#pricing">Τιμές</a>
      <a href="#booking">Κλείσε Ραντεβού</a>
      <a href="#contact">Επικοινωνία</a>
    </nav>
  </header>

  <!-- HERO SECTION -->
  <section id="home" class="hero">
    <div class="hero-slides">
      <img src="slide1.jpg" alt="" class="hero-slide active">
      <img src="slide2.jpg" alt="" class="hero-slide">
      <img src="slide3.jpg" alt="" class="hero-slide">
      <img src="slide4.jpg" alt="" class="hero-slide">
      <img src="slide5.jpg" alt="" class="hero-slide">
      <img src="slide6.jpg" alt="" class="hero-slide">
      <img src="slide7.jpg" alt="" class="hero-slide">
      <img src="slide8.jpg" alt="" class="hero-slide">
      <img src="slide9.jpg" alt="" class="hero-slide">
    </div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>Wake up to<br><span style="font-weight:700;font-style:italic;letter-spacing:2px">FLAWLESS LASHES</span></h1>
    </div>
  </section>

  <div class="container">

    <!-- PRICELIST SECTION -->
    <section id="pricing" class="section-card">
      <div class="price-header-title">2026 Pricelist & Offers</div>
      <div class="price-sub-info">
        Όλες οι υπηρεσίες <strong>Eyelash Extensions</strong> περιλαμβάνουν 
        <span class="badge-gift-header">ΔΩΡΟ Brow Lamination 20€</span>
      </div>

      <!-- OFFERS PILLS -->
      <div class="offers-pill-container">
        <button class="offer-tab-btn active" onclick="selectOffer('regular', this)">Κανονικός</button>
        <button class="offer-tab-btn" onclick="selectOffer('student', this)">Student -10€</button>
        <button class="offer-tab-btn" onclick="selectOffer('first', this)">First Visit -5€</button>
        <button class="offer-tab-btn" onclick="selectOffer('friend', this)">Bring a Friend -10€</button>
      </div>

      <!-- PRICE TABLE -->
      <div class="price-table-header">
        <span>SERVICE</span>
        <span>PRICE</span>
      </div>
      <div id="priceListContainer">
        <!-- Δυναμική φόρτωση με JavaScript -->
      </div>
    </section>

    <!-- BOOKING SECTION -->
    <section id="booking" class="section-card">
      <div class="booking-title">Book Appointment</div>
      <div class="booking-subtitle">ΕΠΙΛΕΞΤΕ ΥΠΗΡΕΣΙΑ, ΗΜΕΡΑ & ΩΡΑ (08:00 - 20:00)</div>

      <form id="bookingForm">
        <!-- Step 1 -->
        <label class="form-step-label">1. Επιλέξτε Υπηρεσία</label>
        <select id="serviceSelect" class="booking-select" required onchange="updatePriceDisplay()">
          <option value="">-- Επιλέξτε υπηρεσία --</option>
          <option value="Brow Wax(ΤΣΙΜΠΙΔΑΚΙ)" data-price="5">Brow Wax (ΤΣΙΜΠΙΔΑΚΙ) (5€)</option>
          <option value="Brow Wax(ΚΕΡΙ)" data-price="10">Brow Wax (ΚΕΡΙ) (10€)</option>
          <option value="Half Set" data-price="35">Half Set (35€)</option>
          <option value="One by One" data-price="45">One by One (45€)</option>
          <option value="Volume 2D-3D" data-price="50">Volume 2D-3D (50€)</option>
          <option value="Volume 4D+" data-price="55">Volume 4D+ (55€)</option>
          <option value="Special Effetcts" data-price="60">Special Effects (60€)</option>
          <option value="Lash Lift + Tint" data-price="35">Lash Lift + Tint (35€)</option>
          <option value="Lash Lift" data-price="30">Lash Lift (30€)</option>
          <option value="Brow Lift" data-price="25">Brow Lift (25€)</option>
          <option value="Brow Lift + Tint" data-price="30">Brow lift + Tint (30€)</option>
          <option value="Brow Lift + Lash Lift + Tint" data-price="55">Brow lift + Lash Lift + Tint (55€)</option>
          <option value="Half Set + Brow lift" data-price="55">Half Set + Brow lift (55€)</option>
          <option value="Volume + Brow lift" data-price="70">Volume + Brow lift (70€)</option>
          <option value="Special Effects + Brow lift" data-price="75">Special Effects+ Brow lift (75€)</option>
          <option value="One by one + Brow lift" data-price="60">One by one  + Brow lift (60€)</option>
        
        </select>

        <!-- Step 2 -->
        <label class="form-step-label">2. Επιλέξτε Ημερομηνία</label>
        <input type="date" id="dateInput" class="booking-input" required>

        <!-- Step 3 -->
        <label class="form-step-label">3. Επιλέξτε Διαθέσιμη Ώρα (08:00 έως 20:00)</label>
        <div class="time-grid" id="timeGrid">
          <!-- Δυναμική φόρτωση ωρών -->
        </div>
        <input type="hidden" id="selectedTime" required>

        <!-- Step 4: Στοιχεία Πελάτη -->
        <label class="form-step-label" style="margin-top:15px;">4. Στοιχεία Επικοινωνίας</label>
        <div class="form-grid">
          <input type="text" id="clientName" class="booking-input" placeholder="Ονοματεπώνυμο *" required style="margin-bottom:0;">
          <input type="tel" id="clientPhone" class="booking-input" placeholder="Κινητό (+30) *" required style="margin-bottom:0;">
        </div>

        <button type="submit" class="btn-submit-booking">ΚΡΑΤΗΣΗ ΡΑΝΤΕΒΟΥ</button>
        <p id="bookingMsg" style="margin-top:12px; text-align:center; font-size:14px;"></p>
      </form>
    </section>

  </div>

  <footer>© VELISSE Lash & Brow Studio</footer>

  <script>
    // PRICE DATA
    const servicesData = [
      { name: "Half Set", price: 35, gift: true },
      { name: "One by One", price: 45, gift: true },
      { name: "Volume 2D-3D", price: 50, gift: true },
      { name: "Volume 4D-6D", price: 55, gift: true },
      { name: "Special Effects", price: 55, gift: true },
      { name: "Lash Lift + Tint", price: 35, gift: false },
      { name: "Lash Lift", price: 35, gift: false },
      { name: "Brow Lift + Tint", price: 30, gift: false },
      { name: "Brow Lift", price: 30, gift: false },
      { name: "Lash Lift + Brow Lift", price: 55, gift: false }
    ];

    let currentDiscount = 0;

    function renderPrices() {
      const container = document.getElementById('priceListContainer');
      container.innerHTML = '';
      servicesData.forEach(item => {
        const finalPrice = Math.max(0, item.price - currentDiscount);
        const row = document.createElement('div');
        row.className = 'price-row';
        row.innerHTML = `
          <div class="price-service-name">
            ${item.name}
            ${item.gift ? '<span class="item-gift-badge">ΔΩΡΟ 20€</span>' : ''}
          </div>
          <div class="price-value">${finalPrice}€</div>
        `;
        container.appendChild(row);
      });
    }

    function selectOffer(type, btn) {
      document.querySelectorAll('.offer-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      if(type === 'student') currentDiscount = 10;
      else if(type === 'first') currentDiscount = 5;
      else if(type === 'friend') currentDiscount = 10;
      else currentDiscount = 0;

      renderPrices();
    }

    // GENERATE TIME SLOTS
    function renderTimeSlots() {
      const grid = document.getElementById('timeGrid');
      grid.innerHTML = '';
      const times = [
        "08:00", "09:00",
        "10:00", "11:00",
        "12:00", "13:00",
        "14:00", "15:00",
        "16:00", "17:00",
        "18:00", "19:00", 
      ];

      // Παράδειγμα διαθέσιμων ωρών (όπως στη φωτο)
      const availableTimes = [availableTimes.includes];

      times.forEach(t => {
        const slot = document.createElement('div');
        const isAvail = availableTimes.includes(t);
        slot.className = `time-slot ${isAvail ? 'available' : ''}`;
        slot.textContent = t;

        if(isAvail) {
          slot.onclick = function() {
            document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
            slot.classList.add('selected');
            document.getElementById('selectedTime').value = t;
          }
        }
        grid.appendChild(slot);
      });
    }

    function toggleMenu() {
      const nav = document.getElementById('dropdownMenu');
      nav.classList.toggle('active');
    }

    // INITIALIZE
    document.addEventListener('DOMContentLoaded', () => {
      renderPrices();
      renderTimeSlots();
      
      // Default Date setup to today
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('dateInput').value = today;
    });

    // FORM SUBMIT
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const time = document.getElementById('selectedTime').value;
      if(!time) {
        alert('Παρακαλώ επιλέξτε διαθέσιμη ώρα!');
        return;
      }
      document.getElementById('bookingMsg').innerHTML = '✅ <strong>Η κράτησή σας καταχωρήθηκε επιτυχώς!</strong>';
    });
  </script>
</body>
</html>
