<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VELISSE Lash & Brow Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #F5F2EC;
      --card-bg: #FFFFFF;
      --pill-bg: #F2EBE1;
      --text: #1A1A1A;
      --subtext: #8E867E;
      --border: #E8E2D9;
      --accent: #D4B483;
      --badge-bg: #F7EFE3;
      --badge-text: #A38051;
      --time-border: #D0D8E0;
      --time-blue: #2B72C4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(0,0,0,0.03);
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      background: #111;
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .logo-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      letter-spacing: 4px;
      font-weight: 500;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .lang-switcher {
      border: 1px solid var(--text);
      padding: 5px 14px;
      border-radius: 20px;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .menu-toggle {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text);
    }
    .dropdown-menu {
      display: none;
      position: absolute;
      top: 60px;
      left: 0;
      width: 100%;
      background: var(--bg);
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      z-index: 999;
    }
    .dropdown-menu.active { display: block; }
    .dropdown-menu a {
      display: block;
      padding: 10px 0;
      text-decoration: none;
      color: var(--text);
      font-size: 15px;
    }

    .hero {
      position: relative;
      height: 60vh;
      min-height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #111;
    }
    .hero-slides { position: absolute; inset: 0; }
    .hero-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .8s ease;
    }
    .hero-slide.active { opacity: 1; }
    .hero-overlay { position: absolute; inset: 0; background: rgba(0,0,0,.35); }
    .hero-content {
      position: relative;
      z-index: 2;
      color: #fff;
      text-align: center;
      padding: 0 20px;
    }
    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 400;
      letter-spacing: 1px;
    }

    .container {
      max-width: 680px;
      margin: 30px auto;
      padding: 0 16px;
    }
    .section-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 32px 24px;
      margin-bottom: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
    }

    .price-header-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      letter-spacing: 5px;
      text-align: center;
      color: #8E867E;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .price-sub-info {
      text-align: center;
      font-size: 13px;
      color: #4A4A4A;
      margin-bottom: 20px;
    }
    .badge-gift-header {
      display: inline-block;
      background: #FFF8EE;
      border: 1px dashed #E5C396;
      color: #B58A4C;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: 4px;
    }

    .offers-pill-container {
      background: var(--pill-bg);
      border-radius: 30px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px;
    }
    .offer-tab-btn {
      padding: 10px 14px;
      border-radius: 20px;
      border: none;
      background: transparent;
      font-size: 13px;
      color: #555;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .offer-tab-btn.active {
      background: #1A1A1A;
      color: #FFFFFF;
      font-weight: 500;
    }

    .price-table-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 2px;
      color: #999;
      text-transform: uppercase;
      padding-bottom: 12px;
      border-bottom: 1px solid #F0F0F0;
      margin-bottom: 8px;
    }
    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid #F7F7F7;
    }
    .price-service-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-weight: 600;
      color: #1A1A1A;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .item-gift-badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 10px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 500;
    }
    .price-value {
      font-size: 16px;
      font-weight: 600;
      color: #1A1A1A;
    }

    .booking-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      letter-spacing: 3px;
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .booking-subtitle {
      font-size: 11px;
      letter-spacing: 2px;
      color: #8E867E;
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .form-step-label {
      font-size: 13px;
      color: #555;
      margin-bottom: 8px;
      display: block;
      font-weight: 500;
    }

    .booking-input, .booking-select {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #FFF;
      font-size: 14px;
      color: #333;
      outline: none;
      margin-bottom: 20px;
      font-family: inherit;
    }
    .booking-input:focus, .booking-select:focus {
      border-color: #1A1A1A;
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }
    .time-slot {
      padding: 10px 0;
      border: 1px solid #EAEAEA;
      border-radius: 8px;
      background: #FAFAFA;
      color: #BBB;
      font-size: 13px;
      text-align: center;
      cursor: not-allowed;
      transition: all 0.2s ease;
    }
    .time-slot.available {
      background: #FFFFFF;
      border-color: var(--time-border);
      color: var(--time-blue);
      cursor: pointer;
    }
    .time-slot.available:hover, .time-slot.selected {
      background: var(--time-blue);
      color: #FFF;
      border-color: var(--time-blue);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .btn-submit-booking {
      width: 100%;
      background: #1A1A1A;
      color: #FFF;
      padding: 16px;
      border-radius: 30px;
      border: none;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }
    .btn-submit-booking:hover { background: #333; }

    footer {
      text-align: center;
      padding: 24px 0;
      color: #999;
      font-size: 0.8rem;
    }

    @media(max-width: 480px) {
      .time-grid { grid-template-columns: repeat(4, 1fr); }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <a href="#home" class="logo-container">
      <div class="logo-icon"><i class="fa-regular fa-eye"></i></div>
      <span class="logo-text">VELISSE</span>
    </a>
    <div class="header-right">
      <button id="langToggle" class="lang-switcher"><i class="fa-solid fa-globe"></i> EN</button>
      <button class="menu-toggle" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
    </div>
    <nav id="dropdownMenu" class="dropdown-menu">
      <a href="#home">Αρχική</a>
      <a href="#pricing">Τιμές</a>
      <a href="#booking">Κλείσε Ραντεβού</a>
      <a href="#contact">Επικοινωνία</a>
    </nav>
  </header>

  <section id="home" class="hero">
    <div class="hero-slides">
      <img src="slide1.jpg" alt="" class="hero-slide active">
      <img src="slide2.jpg" alt="" class="hero-slide">
      <img src="slide3.jpg" alt="" class="hero-slide">
      <img src="slide4.jpg" alt="" class="hero-slide">
      <img src="slide5.jpg" alt="" class="hero-slide">
      <img src="slide6.jpg" alt="" class="hero-slide">
      <img src="slide7.jpg" alt="" class="hero-slide">
      <img src="slide8.jpg" alt="" class="hero-slide">
      <img src="slide9.jpg" alt="" class="hero-slide">
    </div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>Wake up to<br><span style="font-weight:700;font-style:italic;letter-spacing:2px">FLAWLESS LASHES</span></h1>
    </div>
  </section>

  <div class="container">
    <section id="pricing" class="section-card">
      <div class="price-header-title">2026 Pricelist & Offers</div>
      <div class="price-sub-info">
        Όλες οι υπηρεσίες <strong>Eyelash Extensions</strong> περιλαμβάνουν 
        <span class="badge-gift-header">ΔΩΡΟ Brow Lamination</span>
      </div>

      <div class="offers-pill-container">
        <button class="offer-tab-btn active" onclick="selectOffer('regular', this)">Κανονικός</button>
        <button class="offer-tab-btn" onclick="selectOffer('student', this)">Student -10€</button>
        <button class="offer-tab-btn" onclick="selectOffer('first', this)">First Visit -5€</button>
        <button class="offer-tab-btn" onclick="selectOffer('friend', this)">Bring a Friend -10€</button>
      </div>

      <div class="price-table-header">
        <span>SERVICE</span>
        <span>PRICE</span>
      </div>
      <div id="priceListContainer"></div>
    </section>

    <section id="booking" class="section-card">
      <div class="booking-title">Book Appointment</div>
      <div class="booking-subtitle">ΕΠΙΛΕΞΤΕ ΥΠΗΡΕΣΙΑ, ΗΜΕΡΑ & ΩΡΑ (08:00 - 20:00)</div>

      <form id="bookingForm">
        <label class="form-step-label">1. Επιλέξτε Υπηρεσία</label>
        <select id="serviceSelect" class="booking-select" required>
          <option value="">-- Επιλέξτε υπηρεσία --</option>
          <option value="Brow Wax (ΤΣΙΜΠΙΔΑΚΙ)">Brow Wax (ΤΣΙΜΠΙΔΑΚΙ) (5€)</option>
          <option value="Brow Wax (ΚΕΡΙ)">Brow Wax (ΚΕΡΙ) (10€)</option>
          <option value="Half Set">Half Set (35€)</option>
          <option value="One by One">One by One (45€)</option>
          <option value="Volume 2D-3D">Volume 2D-3D (50€)</option>
          <option value="Volume 4D+">Volume 4D+ (55€)</option>
          <option value="Special Effects">Special Effects (60€)</option>
          <option value="Lash Lift + Tint">Lash Lift + Tint (35€)</option>
          <option value="Lash Lift">Lash Lift (30€)</option>
          <option value="Brow Lift">Brow Lift (25€)</option>
          <option value="Brow Lift + Tint">Brow Lift + Tint (30€)</option>
          <option value="Brow Lift + Lash Lift + Tint">Brow Lift + Lash Lift + Tint (55€)</option>
          <option value="Half Set + Brow Lift">Half Set + Brow Lift (55€)</option>
          <option value="Volume + Brow Lift">Volume + Brow Lift (70€)</option>
          <option value="Special Effects + Brow Lift">Special Effects + Brow Lift (75€)</option>
          <option value="One by One + Brow Lift">One by One + Brow Lift (60€)</option>
        </select>

        <label class="form-step-label">2. Επιλέξτε Ημερομηνία</label>
        <input type="date" id="dateInput" class="booking-input" required>

        <label class="form-step-label">3. Επιλέξτε Διαθέσιμη Ώρα (08:00 έως 20:00)</label>
        <div class="time-grid" id="timeGrid"></div>
        <input type="hidden" id="selectedTime" required>

        <label class="form-step-label" style="margin-top:15px;">4. Στοιχεία Επικοινωνίας</label>
        <div class="form-grid">
          <input type="text" id="clientName" class="booking-input" placeholder="Ονοματεπώνυμο *" required style="margin-bottom:0;">
          <input type="tel" id="clientPhone" class="booking-input" placeholder="Κινητό (+30) *" required style="margin-bottom:0;">
        </div>

        <button type="button" id="chooseSendBtn" class="btn-submit-booking">ΕΠΙΛΟΓΗ ΑΠΟΣΤΟΛΗΣ</button>

        <div id="manualSendActions" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;">
          <button type="button" id="btnViber" class="btn-submit-booking" style="margin-top:0;background:#7360F2;">Αποστολή σε Viber</button>
          <button type="button" id="btnWhatsApp" class="btn-submit-booking" style="margin-top:0;background:#25D366;">Αποστολή σε WhatsApp</button>
        </div>

        <p id="bookingMsg" style="margin-top:12px; text-align:center; font-size:14px;"></p>
      </form>
    </section>
  </div>

  <footer>© VELISSE Lash & Brow Studio</footer>

  <script>
    const STUDIO_PHONE_E164_NO_PLUS = '306909392922';
    const servicesData = [
      { name: "Half Set", price: 35, gift: true },
      { name: "One by One", price: 45, gift: true },
      { name: "Volume 2D-3D", price: 50, gift: true },
      { name: "Volume 4D-6D", price: 55, gift: true },
      { name: "Special Effects", price: 55, gift: true },
      { name: "Lash Lift + Tint", price: 35, gift: false },
      { name: "Lash Lift", price: 35, gift: false },
      { name: "Brow Lift + Tint", price: 30, gift: false },
      { name: "Brow Lift", price: 30, gift: false },
      { name: "Lash Lift + Brow Lift", price: 55, gift: false }
    ];

    let currentDiscount = 0;

    function renderPrices() {
      const container = document.getElementById('priceListContainer');
      container.innerHTML = '';
      servicesData.forEach(item => {
        const finalPrice = Math.max(0, item.price - currentDiscount);
        const row = document.createElement('div');
        row.className = 'price-row';
        row.innerHTML = `
          <div class="price-service-name">
            ${item.name}
            ${item.gift ? '<span class="item-gift-badge">ΔΩΡΟ Brow Lamination€</span>' : ''}
          </div>
          <div class="price-value">${finalPrice}€</div>
        `;
        container.appendChild(row);
      });
    }

    function selectOffer(type, btn) {
      document.querySelectorAll('.offer-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if(type === 'student') currentDiscount = 10;
      else if(type === 'first') currentDiscount = 5;
      else if(type === 'friend') currentDiscount = 10;
      else currentDiscount = 0;
      renderPrices();
    }

    function renderTimeSlots() {
      const grid = document.getElementById('timeGrid');
      grid.innerHTML = '';
      const times = [
        "08:00", "08:30", "09:00", "09:30",
        "10:00", "10:30", "11:00", "11:30",
        "12:00", "12:30", "13:00", "13:30",
        "14:00", "14:30", "15:00", "15:30",
        "16:00", "16:30", "17:00", "17:30",
        "18:00", "18:30", "19:00", "19:30"
      ];

      times.forEach(t => {
        const slot = document.createElement('div');
        slot.className = 'time-slot available';
        slot.textContent = t;
        slot.onclick = function() {
          document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
          slot.classList.add('selected');
          document.getElementById('selectedTime').value = t;
        };
        grid.appendChild(slot);
      });
    }

    function toggleMenu() {
      const nav = document.getElementById('dropdownMenu');
      nav.classList.toggle('active');
    }

    function gatherBooking() {
      return {
        service: document.getElementById('serviceSelect').value.trim(),
        date: document.getElementById('dateInput').value.trim(),
        time: document.getElementById('selectedTime').value.trim(),
        name: document.getElementById('clientName').value.trim(),
        phone: document.getElementById('clientPhone').value.trim()
      };
    }

    function validateBooking(b) {
      return b.service && b.date && b.time && b.name && b.phone;
    }

    function bookingText(b) {
      return `Γεια σας VELISSE! Θέλω ραντεβού:
Ονοματεπώνυμο: ${b.name}
Κινητό: ${b.phone}
Υπηρεσία: ${b.service}
Ημερομηνία: ${b.date}
Ώρα: ${b.time}`;
    }

    function sendToWhatsApp() {
      const msg = document.getElementById('bookingMsg');
      const b = gatherBooking();
      if (!validateBooking(b)) {
        msg.innerHTML = '❌ Συμπλήρωσε όλα τα πεδία και επίλεξε ώρα.';
        return;
      }
      const text = encodeURIComponent(bookingText(b));
      window.open(`https://wa.me/${STUDIO_PHONE_E164_NO_PLUS}?text=${text}`, '_blank');
      msg.innerHTML = '✅ Άνοιξε το WhatsApp. Πάτησε αποστολή.';
    }

    function sendToViber() {
      const msg = document.getElementById('bookingMsg');
      const b = gatherBooking();
      if (!validateBooking(b)) {
        msg.innerHTML = '❌ Συμπλήρωσε όλα τα πεδία και επίλεξε ώρα.';
        return;
      }
      const text = encodeURIComponent(bookingText(b));
      window.location.href = `viber://forward?text=${text}`;
      msg.innerHTML = '✅ Αν δεν άνοιξε αυτόματα το Viber, κάνε copy το μήνυμα και στείλ’ το χειροκίνητα.';
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderPrices();
      renderTimeSlots();

      const dateInput = document.getElementById('dateInput');
      dateInput.value = new Date().toISOString().split('T')[0];

      const slides = document.querySelectorAll('.hero-slide');
      if (slides.length > 1) {
        let i = 0;
        setInterval(() => {
          slides[i].classList.remove('active');
          i = (i + 1) % slides.length;
          slides[i].classList.add('active');
        }, 3500);
      }

      document.getElementById('chooseSendBtn').addEventListener('click', () => {
        const msg = document.getElementById('bookingMsg');
        const b = gatherBooking();
        msg.innerHTML = validateBooking(b)
          ? 'Επέλεξε αποστολή: Viber ή WhatsApp.'
          : '❌ Συμπλήρωσε όλα τα πεδία και επίλεξε ώρα.';
      });

      document.getElementById('btnWhatsApp').addEventListener('click', sendToWhatsApp);
      document.getElementById('btnViber').addEventListener('click', sendToViber);
    });
  </script>
</body>
</html>
